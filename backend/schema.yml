components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
      required:
      - id
      - name
    CustomerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
      required:
      - name
    DecisionDecisionEnum:
      enum:
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `APPROVED` - APPROVED
        * `REJECTED` - REJECTED
    DecisionRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionDecisionEnum'
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - decision
      - reason
    IntegrationLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lead:
          type: string
          format: uuid
        integration:
          type: string
          maxLength: 80
        status:
          $ref: '#/components/schemas/IntegrationStatus'
        attempt:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        error:
          type: string
        payload:
          type: object
          additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - lead
      - payload
      - updated_at
    IntegrationStatus:
      enum:
      - PENDING
      - RETRYING
      - SUCCESS
      - FAILED
      type: string
      description: |-
        * `PENDING` - PENDING
        * `RETRYING` - RETRYING
        * `SUCCESS` - SUCCESS
        * `FAILED` - FAILED
    Lead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          $ref: '#/components/schemas/Customer'
        channel:
          type: string
        content:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/WorkflowStatus'
          readOnly: true
        category:
          type: string
          readOnly: true
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        tags: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        idempotency_key:
          type: string
          nullable: true
          maxLength: 160
      required:
      - category
      - channel
      - content
      - created_at
      - customer
      - id
      - status
