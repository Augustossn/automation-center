apiVersion: v1
kind: ConfigMap
metadata:
  name: automation-config
  namespace: automation-center
data:
  DEBUG: '0'
  POSTGRES_DB: automation
  POSTGRES_USER: automation
  POSTGRES_HOST: postgres.database.svc.cluster.local
  REDIS_URL: redis://redis.cache.svc.cluster.local:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka.events.svc.cluster.local:9092
  AGENT_ADAPTER: mock
  ALLOWED_HOSTS: automation.example.com,backend,localhost
