apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: automation-center}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: backend
          image: automation-center-backend:1.0.0
          envFrom: [{configMapRef: {name: automation-config}}, {secretRef: {name: automation-secrets}}]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: '1', memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: automation-center}
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: automation-center}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: automation-center-backend:1.0.0
          command: [celery, -A, config, worker, -l, INFO]
          envFrom: [{configMapRef: {name: automation-config}}, {secretRef: {name: automation-secrets}}]
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: '1', memory: 512Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: consumer, namespace: automation-center}
spec:
  replicas: 2
  selector: {matchLabels: {app: consumer}}
  template:
    metadata: {labels: {app: consumer}}
    spec:
      containers:
        - name: consumer
          image: automation-center-backend:1.0.0
          command: [python, manage.py, consume_events]
          envFrom: [{configMapRef: {name: automation-config}}, {secretRef: {name: automation-secrets}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: beat, namespace: automation-center}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: beat}}
  template:
    metadata: {labels: {app: beat}}
    spec:
      containers:
        - name: beat
          image: automation-center-backend:1.0.0
          command: [celery, -A, config, beat, -l, INFO, --schedule, /tmp/celerybeat-schedule]
          envFrom: [{configMapRef: {name: automation-config}}, {secretRef: {name: automation-secrets}}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: automation-center}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: automation-center-frontend:1.0.0
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: automation-center}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
