name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: automation, POSTGRES_USER: automation, POSTGRES_PASSWORD: automation-local}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U automation" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock.txt}
      - run: pip install -r requirements.lock.txt
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: pytest -q -m 'not kafka'
      - run: python manage.py spectacular --file schema.yml --validate
      - uses: actions/upload-artifact@v4
        with: {name: openapi, path: backend/schema.yml}
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: frontend/test-results}
  event-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres redis kafka
      - run: docker compose run --rm migrate
      - run: docker compose run --rm -e KAFKA_INTEGRATION=1 backend pytest -q -m kafka
      - run: docker compose down -v
        if: always()
